<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" fill="none">
    <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#7f9cb8" stop-opacity="0.55" />
            <stop offset="1" stop-color="#56738f" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="fade" cx="50%" cy="50%" r="50%">
            <stop offset=".35" stop-color="#fff" />
            <stop offset="1" stop-color="#000" />
        </radialGradient>
        <mask id="dotmask"><rect width="440" height="440" fill="url(#fade)" /></mask>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#cfc9be" />
        </pattern>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0.35" />
            <stop offset=".5" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
        <!-- Right half of the plate: its edge and underside take the darker shade -->
        <clipPath id="right"><rect x="0" y="-500" width="500" height="1000" /></clipPath>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" /></filter>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30" /></filter>
    </defs>

    <style>
        @media (prefers-reduced-motion: no-preference) {
            .float { animation: float 7s ease-in-out infinite; }
            .float-2 { animation: float 7s ease-in-out -2.5s infinite; }
        }
        @keyframes float { 50% { transform: translateY(-7px); } }
    </style>

    <!-- Dotted grid, fading out toward the edges -->
    <rect width="440" height="440" fill="url(#dots)" mask="url(#dotmask)" />

    <!-- Accent glow behind the stack, plus rings on the ground plane -->
    <circle cx="220" cy="215" r="150" fill="url(#glow)" filter="url(#soft)" />
    <ellipse cx="220" cy="318" rx="165" ry="95" stroke="#6a89a7" stroke-opacity=".55" stroke-dasharray="2 5" />
    <ellipse cx="220" cy="318" rx="120" ry="69" stroke="#6a89a7" stroke-opacity=".3" />

    <!-- Plates, bottom to top: the packages, crowned by the logo -->
    <g transform="translate(220 282)">
        <g>
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(10 18) matrix(1 .5 -1 .5 0 0)" fill="#000" opacity="0.18" filter="url(#blur)"/>
            <rect x="-141.8" y="0" width="141.8" height="8" fill="#a4b6c7"/>
            <rect x="0" y="0" width="141.8" height="8" fill="#8aa2b9"/>
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#a4b6c7"/>
            <g clip-path="url(#right)"><rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#8aa2b9"/></g>
            <g transform="matrix(1 .5 -1 .5 0 0)">
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="#d0d8e0" stroke="#abbccb" stroke-width="1.25"/>
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="url(#sheen)"/>
                
            </g>
        </g>
    </g>
    <g transform="translate(220 230)">
        <g>
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(10 18) matrix(1 .5 -1 .5 0 0)" fill="#000" opacity="0.18" filter="url(#blur)"/>
            <rect x="-141.8" y="0" width="141.8" height="8" fill="#b0bfce"/>
            <rect x="0" y="0" width="141.8" height="8" fill="#96abbf"/>
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#b0bfce"/>
            <g clip-path="url(#right)"><rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#96abbf"/></g>
            <g transform="matrix(1 .5 -1 .5 0 0)">
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="#dbe1e6" stroke="#abbccb" stroke-width="1.25"/>
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="url(#sheen)"/>
                <path d="M0 34h58" stroke="#56738f" stroke-width="6" stroke-linecap="round"/><path d="M0 48h40" stroke="#c8d2dc" stroke-width="6" stroke-linecap="round"/><path d="M0 62h50" stroke="#c8d2dc" stroke-width="6" stroke-linecap="round"/>
            </g>
        </g>
    </g>
    <g transform="translate(220 178)">
        <g class="float-2">
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(10 18) matrix(1 .5 -1 .5 0 0)" fill="#000" opacity="0.18" filter="url(#blur)"/>
            <rect x="-141.8" y="0" width="141.8" height="8" fill="#bbc8d4"/>
            <rect x="0" y="0" width="141.8" height="8" fill="#a1b4c6"/>
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#bbc8d4"/>
            <g clip-path="url(#right)"><rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#a1b4c6"/></g>
            <g transform="matrix(1 .5 -1 .5 0 0)">
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="#e7eaed" stroke="#abbccb" stroke-width="1.25"/>
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="url(#sheen)"/>
                <path d="M0 34h40" stroke="#56738f" stroke-width="6" stroke-linecap="round"/><path d="M0 48h60" stroke="#c8d2dc" stroke-width="6" stroke-linecap="round"/><path d="M0 62h30" stroke="#c8d2dc" stroke-width="6" stroke-linecap="round"/>
            </g>
        </g>
    </g>
    <g transform="translate(220 126)">
        <g class="float">
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(10 18) matrix(1 .5 -1 .5 0 0)" fill="#000" opacity="0.18" filter="url(#blur)"/>
            <rect x="-141.8" y="0" width="141.8" height="8" fill="#d0d8e0"/>
            <rect x="0" y="0" width="141.8" height="8" fill="#b5c4d1"/>
            <rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#d0d8e0"/>
            <g clip-path="url(#right)"><rect x="-75" y="-75" width="150" height="150" rx="14" transform="translate(0 8) matrix(1 .5 -1 .5 0 0)" fill="#b5c4d1"/></g>
            <g transform="matrix(1 .5 -1 .5 0 0)">
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="#fbfaf8" stroke="#abbccb" stroke-width="1.25"/>
                <rect x="-75" y="-75" width="150" height="150" rx="14" fill="url(#sheen)"/>
                <g fill="#56738f"><rect x="-44" y="-44" width="40" height="40" rx="10"/><rect x="4" y="-44" width="40" height="40" rx="10" opacity=".4"/><rect x="-44" y="4" width="40" height="40" rx="10" opacity=".4"/><rect x="4" y="4" width="40" height="40" rx="10"/></g>
            </g>
        </g>
    </g>
</svg>
